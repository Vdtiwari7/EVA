name: Deploy Flora Deck → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'flora/**'
      - '.github/workflows/deploy-flora.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flora/package-lock.json

      - name: Install dependencies
        working-directory: flora
        run: npm ci

      - name: Build
        working-directory: flora
        run: npm run build
        env:
          GITHUB_PAGES: true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: flora/dist
