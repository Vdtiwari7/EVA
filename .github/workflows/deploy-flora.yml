name: Deploy Flora Deck → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'flora/**'
      - '.github/workflows/deploy-flora.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flora/package-lock.json

      - name: Install dependencies
        working-directory: flora
        run: npm ci

      - name: Build
        working-directory: flora
        run: npm run build
        env:
          GITHUB_PAGES: true

      - name: Clear stale Pages deployments
        run: |
          IDS=$(gh api repos/${{ github.repository }}/deployments \
            --jq '[.[] | select(.environment=="github-pages")] | .[].id')
          for ID in $IDS; do
            STATE=$(gh api repos/${{ github.repository }}/deployments/$ID/statuses \
              --jq '.[0].state // "none"')
            if [[ "$STATE" != "success" && "$STATE" != "inactive" ]]; then
              gh api repos/${{ github.repository }}/deployments/$ID/statuses \
                -X POST -f state=inactive --silent
              echo "Cleared deployment $ID (was: $STATE)"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flora/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
